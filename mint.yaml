version: 1
name: Crown Town Compost
slug: crowntowncompost
summary: >-
  Crown Town Compost pickups, invoices, and service skips for Claude —
  access via natural language
examples:
  - prompt: When is my next compost pickup, and what time does the truck usually show up?
    note: Uses the pickup schedule and the observed arrival window.
  - prompt: Were any of my pickups in the last two months marked missing or inaccessible?
    note: Filters service history by stop status.
  - prompt: How much did I pay Crown Town Compost this year, and is any invoice still unpaid?
    note: Read-only billing history with invoice status.
env:
  - name: CROWNTOWN_SESSION_COOKIE
    secret: true
    required: false
    help: >-
      A Cookie header from an already-signed-in portal session
      ("sessionid=...; csrftoken=..."). Supply this and no password is needed —
      the Django login is skipped entirely.
  - name: CROWNTOWN_USERNAME
    required: false
    help: >-
      Your portal.crowntowncompost.com username or email address. Needed only
      if you are not supplying CROWNTOWN_SESSION_COOKIE.
  - name: CROWNTOWN_PASSWORD
    secret: true
    required: false
    help: >-
      Your Crown Town Compost customer-portal password. Needed only if you are
      not supplying CROWNTOWN_SESSION_COOKIE.
  - name: CROWNTOWN_SESSION_CACHE
    required: false
    help: >-
      Set to false to disable the on-disk session cache and log in on every
      process start. Defaults to enabled.
  - name: CROWNTOWN_SESSION_FILE
    required: false
    help: >-
      Absolute path for the session cache file. Defaults to
      $MCP_DATA_DIR/.crowntowncompost-mcp/session.json.

state:
  dataDir: true
  reason: >-
    Caches the signed-in portal session at
    $MCP_DATA_DIR/.crowntowncompost-mcp/session.json (0600). Without it every
    cold start re-runs the Django CSRF-then-POST login handshake, and a hosted
    child idles out after ten minutes, so that is most starts. Only the cookie
    jar is written — the username, password and any supplied
    CROWNTOWN_SESSION_COOKIE stay in the environment, and the record is bound to
    a salted digest of them so replacing any of them discards it.

egress:
  allow:
    # Only hosts the SERVER process actually fetches.
    - portal.crowntowncompost.com
